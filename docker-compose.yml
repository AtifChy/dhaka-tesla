services:
  postgres:
    image: postgres:18-alpine
    container_name: dhaka-tesla-postgres
    restart: always
    environment:
      POSTGRES_DB: dhaka_tesla
      POSTGRES_USER: dhaka_tesla
      POSTGRES_PASSWORD: dhaka_tesla_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dhaka_tesla_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhaka_tesla -d dhaka_tesla"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
    image: dhaka-tesla-pool-api:local
    command: ["sh", "-c", "bun run migrate && bun run db:seed"]
    environment: &api-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://dhaka_tesla:dhaka_tesla_dev@postgres:5432/dhaka_tesla
      PORT: 3000
      HOST: 0.0.0.0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-only-change-this-secret-1234}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    image: dhaka-tesla-pool-api:local
    environment: *api-environment
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/api/v1/health'); if (!response.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        API_INTERNAL_URL: http://api:3000
    image: dhaka-tesla-pool-web:local
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3001'); if (!response.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  dhaka_tesla_postgres_data:
